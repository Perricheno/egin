name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy & Build on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            
            APP_DIR=~/agriplan
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            
            # 1. Клонируем или обновляем код
            if [ -d "$APP_DIR/repo" ]; then
              cd $APP_DIR/repo
              git fetch --depth 1 origin main
              git reset --hard origin/main
            else
              mkdir -p $APP_DIR
              git clone --depth 1 --branch main $REPO_URL $APP_DIR/repo
              cd $APP_DIR/repo
            fi
            
            # 2. Записываем .env
            cat > $APP_DIR/.env << 'ENVEOF'
            ${{ secrets.PROD_ENV_FILE }}
            ENVEOF
            # Убираем пробелы в начале строк (heredoc indent)
            sed -i 's/^[[:space:]]*//' $APP_DIR/.env
            
            # 3. Создаём сеть если нет
            docker network create agriplan_default 2>/dev/null || true
            
            # 4. Собираем оба образа ПАРАЛЛЕЛЬНО прямо на сервере
            cd $APP_DIR/repo
            
            docker build \
              --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
              -t agriplan-frontend:latest \
              -f frontend/Dockerfile \
              ./frontend &
            PID_FRONT=$!
            
            docker build \
              -t agriplan-backend:latest \
              -f backend/Dockerfile \
              ./backend &
            PID_BACK=$!
            
            # Ждём завершения обоих билдов
            wait $PID_FRONT
            wait $PID_BACK
            
            # 5. Копируем docker-compose и запускаем
            cp docker-compose.prod.yml $APP_DIR/docker-compose.yml
            cd $APP_DIR
            
            docker compose down
            docker compose up -d
            
            # 6. Чистим мусор
            docker image prune -f
            
            echo "✅ Деплой завершён!"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agriplan-postgres
    restart: always
    environment:
      POSTGRES_DB: agriplan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agriplan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: agriplan-backend:latest
    container_name: agriplan-backend
    restart: always
    ports:
      - "127.0.0.1:3284:3284"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: agriplan-frontend:latest
    container_name: agriplan-frontend
    restart: always
    ports:
      - "127.0.0.1:3285:3285"
    environment:
      - PORT=3285
      - HOSTNAME=0.0.0.0

  redis:
    image: redis:7-alpine
    container_name: agriplan-redis
    restart: always

volumes:
  postgres_data:

networks:
  default:
    name: agriplan_default
